<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efe Mert | Gamer & Developer</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card">
        <div class="profile-section">
            <div class="image-wrapper">
                <img src="profil.jpg" alt="Efe Mert" class="avatar" id="user-avatar" onerror="this.src='https://github.com/efemert2181.png'">
            </div>
            
            <h1 id="title">Merhaba, Ben <span class="highlight">Efe</span></h1>
            <p id="subtitle" class="subtitle">GAMER & DEVELOPER</p>
        </div>

        <article class="bio">
            <p id="bio-text">YouTube kanalımda popüler oyunların videolarını, rehberlerini ve en komik anlarını paylaşıyorum. Aynı zamanda yazılım dünyasında kendimi geliştiriyorum.</p>
        </article>

        <div class="cta-buttons">
            <a href="https://www.youtube.com/@efemert2181" target="_blank" class="btn-primary" id="btn-yt">Youtube Kanalıma Git</a>
            <a href="https://www.instagram.com/efe_01107/" target="_blank" class="btn-instagram" id="btn-insta">Instagram Hesabıma Git</a>
            
            <button id="lang-btn" class="btn-secondary">İngilizce</button>
        </div>

        <footer class="signature">
            Purpleguy © 2026 - tablet power
        </footer>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js');
        });
      }
    </script>

    <script src="Translations.js"></script>
    <script src="Script.js"></script>
</body>
</html>
